# ReallyCache — browser cache headers for Nginx.
# Include inside the site's `server { }` block, e.g.:
#   include /etc/nginx/snippets/reallycache-browser-cache.conf;
# Fixes the PageSpeed "use efficient cache lifetimes" audit.

location ~* \.(css|js|mjs|woff2?|ttf|otf|svg|jpe?g|png|gif|webp|avif|ico)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
    try_files $uri =404;
}
